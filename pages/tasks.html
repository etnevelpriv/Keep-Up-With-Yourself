<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Létrehozás</title>
</head>

<body>
    <header>
        <nav class="navbar">
            <a class="navbar-logo" href="#hero">
                <img src="/assets/images/logo.png" alt="Logo">
            </a>
            <!-- https://www.sliderrevolution.com/resources/css-hamburger-menu/ -->
            <svg class="nav-toggle" id="navToggle" viewBox="0 0 100 100" width="80">
                <path class="line top"
                    d="m 30,33 h 40 c 0,0 9.044436,-0.654587 9.044436,-8.508902 0,-7.854315 -8.024349,-11.958003 -14.89975,-10.85914 -6.875401,1.098863 -13.637059,4.171617 -13.637059,16.368042 v 40" />
                <path class="line middle" d="m 30,50 h 40" />
                <path class="line bottom"
                    d="m 30,67 h 40 c 12.796276,0 15.357889,-11.717785 15.357889,-26.851538 0,-15.133752 -4.786586,-27.274118 -16.667516,-27.274118 -11.88093,0 -18.499247,6.994427 -18.435284,17.125656 l 0.252538,40" />
            </svg>
            <ul id="navList">
                <li><a href="/pages/create.html">Létrehozás</a></li>
                <li><a href="/pages/tasks.html">Feladataim</a></li>
                <li><a href="/pages/profile.html">Profilom</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="tasks-head"></div>
        <div class="tasks-controls" aria-label="Feladatok szűrése és rendezése">
            <fieldset class="filter-group">
                <legend>Állapot szűrése</legend>
                <label>
                    <input type="checkbox" name="statusFilter" value="Folyamatban">
                    Folyamatban
                </label>
                <label>
                    <input type="checkbox" name="statusFilter" value="Lejárt">
                    Lejárt
                </label>
                <label>
                    <input type="checkbox" name="statusFilter" value="Teljesített">
                    Teljesített
                </label>
            </fieldset>
            <fieldset class="filter-group">
                <legend>Fontosság szűrése</legend>
                <label>
                    <input type="checkbox" name="importanceFilter" value="1">
                    1
                </label>
                <label>
                    <input type="checkbox" name="importanceFilter" value="2">
                    2
                </label>
                <label>
                    <input type="checkbox" name="importanceFilter" value="3">
                    3
                </label>
                <label>
                    <input type="checkbox" name="importanceFilter" value="4">
                    4
                </label>
                <label>
                    <input type="checkbox" name="importanceFilter" value="5">
                    5
                </label>
            </fieldset>
            <div class="sort-group">
                <label for="taskSortSelect">Rendezés</label>
                <select id="taskSortSelect" name="taskSortSelect">
                    <option value="none">Alapértelmezett</option>
                    <option value="deadline-asc">Határidő szerint növekvő</option>
                    <option value="deadline-desc">Határidő szerint csökkenő</option>
                    <option value="name-asc">Név szerint növekvő</option>
                    <option value="name-desc">Név szerint csökkenő</option>
                </select>
            </div>
            <button type="button" id="resetTaskFilters">Szűrők törlése</button>
            <p class="tasks-summary" id="tasksSummary" aria-live="polite"></p>
        </div>
        <div class="tasks-cards" id="tasksCards"></div>
        <div class="modify-modal" id="modifyModal">
            <div class="modal-head">
                <h2>Feladat módosítása</h2>
                <span></span>
            </div>
            <form class="modify-form" id="modifyForm">
                <div class="form-element">
                    <label for="taskName">Feladat neve</label>
                    <input required type="text" name="taskName" minlength="3" maxlength="50" id="taskNameInput">
                </div>
                <div class="form-element">
                    <label for="taskDesc">Feladat leírása</label>
                    <textarea required name="taskDesc" maxlength="300" id="taskDescTextarea"></textarea>
                </div>
                <div class="form-element">
                    <label for="taskDeadline">Feladat határideje</label>
                    <input required type="datetime-local" name="taskDeadline" id="taskDeadlineInput">
                </div>
                <div class="form-element">
                    <label for="taskImportance">Feladat fontossága</label>
                    <input required type="range" min="1" max="5" step="1" name="taskImportance"
                        id="taskImportanceInput">
                    <span id="taskImportanceText"></span>
                </div>
                <div class="form-element">
                    <label for="taskNewType">Új típus hozzáadása</label>
                    <input type="checkbox" name="taskNewType" id="taskNewTypeInput">
                </div>
                <div id="newType" class="form-element hide">
                    <label for="taskTypeName">Feladat típusa</label>
                    <input type="text" name="taskTypeName" maxlength="40" id="taskTypeNameInput">
                </div>
                <div id="oldType" class="form-element">
                    <label for="taskTypeName">Feladat típusa</label>
                    <select name="taskTypeName" required id="taskTypeNameSelect">
                    </select>
                </div>
                <input type="submit" value="Feladat módosítása">
                <button type="button" class="delete-task-button" id="deleteTaskButton">Feladat törlése</button>
            </form>
        </div>
    </main>
    <script type="module" src="../src/scripts/tasks.ts"></script>
    <script type="module" src="../src/scripts/auth.ts"></script>
</body>

</html>
