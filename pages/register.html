<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regisztráció</title>
</head>

<body>
    <form action="submit" id="registerForm">
        <input type="text" placeholder="Példa István" name="name" id="nameInput">
        <input type="email" placeholder="pelda@keepupwithyourself.hu" name="email" id="emailInput">
        <input type="password" placeholder="PéldaJelszó123." name="password" id="passwordInput">
        <ul class="form-password-requirements">
            <li class="form-password-requirement">8-16 karakter</li>
            <li class="form-password-requirement">Min. 1 kis karakter (a-z)</li>
            <li class="form-password-requirement">Min. 1 nagy karakter (A-Z)</li>
            <li class="form-password-requirement">Min. 1 szám karakter (0-9)</li>
            <li class="form-password-requirement">Min. 1 különleges karakter (.!-)</li>
        </ul>
        <button id="registerButton" type="submit">Regisztráció</button>
    </form>
    <button class="google-button" id="googleButton">Regisztráció Google-lel</button>
    <a href="./login.html">Már van fiókom</a>
    <div>
        <p class="error-message" id="errorMessage"></p>
    </div>
    <div>
        <p class="info-message" id="infoMessage"></p>
    </div>
</body>

<script type="module" src="../src/scripts/firebase.ts"></script>
<script type="module" src="../src/scripts/auth.ts"></script>
<script type="module" src="../src/scripts/register.ts"></script>

</html>
