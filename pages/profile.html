        <div class="profile-infos">
            <div class="profile-head">
                <h2>Fiókom</h2>

                <ul>

        <div class="profile-actions">

            <button class="sign-out-button" id="signOutButton">Kijelentkezés</button>

        </div>
        <div>
            <p class="error-message" id="errorMessage"></p>
