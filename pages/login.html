<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bejelentkezés</title>
</head>

<body>
    <form action="submit" id="loginForm">
        <input type="email" placeholder="pelda@keepupwithyourself.hu" name="email" id="emailInput">
        <input type="password" placeholder="PéldaJelszó123." name="password" id="passwordInput">
        <button id="loginButton" type="submit">Bejelentkezés</button>
    </form>
    <button class="google-button" id="googleButton">Bejelentkezés Google-lel</button>
    <button class="forgot-pass-button" id="forgotPassButton">Elfelejtett jelszó</button>
    <a href="./register.html">Még nincs fiókom</a>
    <div class="forgot-pass-modal hide" id="forgotPassModal">
        <h2>Kérjük, add meg az e-mail-címedet, hogy elküldhessük a jelszó-visszaállítási levelet.</h2>
        <input type="email" placeholder="pelda@keepupwithyourself.hu" name="email" id="forgotPassEmailInput">
        <button id="forgotPassSendButton">E-mail küldése</button>
    </div>
    <div>
        <p class="error-message" id="errorMessage"></p>
    </div>
    <div>
        <p class="info-message" id="infoMessage"></p>
    </div>

</body>

<script type="module" src="../src/scripts/firebase.ts"></script>
<script type="module" src="../src/scripts/auth.ts"></script>
<script type="module" src="../src/scripts/login.ts"></script>

</html>
