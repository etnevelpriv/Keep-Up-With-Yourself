<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bejelentkezés</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>

<body>
    <header>
        <a href="/" class="header-back-button">Vissza</a>
    </header>
    <form action="submit" id="loginForm">
        <input type="email" placeholder="pelda@keepupwithyourself.hu" name="email" id="emailInput">
        <div class="password-input-wrapper">
            <input type="password" placeholder="PéldaJelszó123." name="password" id="passwordInput">
            <button class="password-visibility-toggle" id="passwordVisibilityToggle" type="button">
                <i id="passwordIcon" class="fa-solid fa-eye"></i>
            </button>
        </div>        <button id="loginButton" type="submit">Bejelentkezés</button>
    </form>
    <button class="google-button" id="googleButton" type="button"><i class="fa-brands fa-google"></i>Bejelentkezés Google-lel</button>
    <button class="forgot-pass-button" id="forgotPassButton" type="button">Elfelejtett jelszó</button>
    <a href="/regisztralas">Még nincs fiókom</a>
    <div class="forgot-pass-modal hide" id="forgotPassModal">
        <h2>Kérjük, add meg az e-mail-címedet, hogy elküldhessük a jelszó-visszaállítási levelet.</h2>
        <input type="email" placeholder="pelda@keepupwithyourself.hu" name="email" id="forgotPassEmailInput">
        <button id="forgotPassSendButton" type="button">E-mail küldése</button>
    </div>

</body>

<script type="module" src="../src/scripts/firebase.ts"></script>
<script type="module" src="../src/scripts/auth.ts"></script>
<script type="module" src="../src/scripts/login.ts"></script>

</html>
